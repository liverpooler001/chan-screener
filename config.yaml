# ============================================================
#  A股 / ETF 缠论多级别买点筛选 —— 参数配置
#  改完直接提交，GitHub Actions 下次运行即生效
# ============================================================

# ---------- 股票池基础过滤 ----------
universe:
  exclude_st: true            # 排除 ST / *ST / 退市整理
  exclude_bse: true           # 排除北交所（43x / 83x / 87x / 88x / 920）
  require_positive_pe: true   # 动态市盈率必须为正（<=0 或 亏损 一律剔除）
  min_amount: 0               # 成交额下限（元）。0 = 不限制。示例：30000000 = 3000万
  min_total_mv: 0             # 总市值下限（元）。0 = 不限制。示例：2000000000 = 20亿

# ---------- 缠论级别参数 ----------
# buy_kinds 按级别拆开：30 分钟只认 二买/三买，5 分钟增加 一买
levels:
  m30:
    period: "30"
    lookback_days: 150        # 回溯日历天数（30分钟K线，约 3 个月交易日）
    max_bars_ago: 16          # 买点有效期：距最新K线不超过 16 根 ≈ 2 个交易日
    min_gap: 4                # 笔的最小分型间隔
    beichi_ratio: 0.85        # 背驰阈值：本笔动能 / 前同向笔动能 < 该值判为背驰
    buy_kinds: ["2", "3"]     # 30 分钟：二买 / 三买
  m5:
    period: "5"
    lookback_days: 40         # 5分钟K线回溯（约 25 个交易日）
    max_bars_ago: 48          # 约 1 个交易日
    min_gap: 4
    beichi_ratio: 0.85
    buy_kinds: ["1", "2", "3"]  # 5 分钟：一买（背驰）/ 二买 / 三买

# ---------- 买点类型（兜底默认，级别里没写 buy_kinds 时用这里）----------
buy_kinds: ["2", "3"]

# ---------- 买点严格度（缠论原始口径：宁可少而准）----------
strict:
  # 二买必须由 MACD 背驰的一买引出。false 会退化成
  # "任意创阶段新低 + 反弹 + 回调不破前低"，命中多但大量不是二买结构。
  require_beichi_for_buy2: true
  # 一买本身就是"向下离开中枢 + MACD 背驰"的结构，天然要求背驰，无开关。
  # 中枢最小高度（占上沿比例）。太窄的重叠区都是噪音，过滤掉可挡掉大量伪三买。
  # 0.006 = 0.6%；想放宽设 0.003，想更严设 0.01。
  min_zs_span_pct: 0.006
  # 三买回调必须高出中枢上沿的缓冲比例，避免"贴着上沿"的模糊信号
  zs_break_tol: 0.003
  # 现价距买点的涨幅上限（追高过滤）。超过说明买点机会已错过，不再展示。
  # 0.15 = 15%；设为 0 关闭该过滤。
  max_gain_from_buy_pct: 0.15

# ---------- 有效性校验 ----------
# 最新价相对买点价位的允许跌破幅度，超出则视为信号失效
break_tolerance: 0.005

# ---------- 性能 ----------
concurrency: 8                # 并发线程数，Actions 上 8~12 比较稳

# ---------- ETF ----------
etf:
  enabled: true
  same_type_limit: 1          # 同类型 ETF 只保留 N 只（按得分取最高的）
